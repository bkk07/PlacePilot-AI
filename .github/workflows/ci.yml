name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      # Heavy extras (sentence-transformers/torch, reportlab) are intentionally
      # omitted; tests needing them or live services skip gracefully.
      - name: Install dependencies
        run: |
          pip install fastapi "uvicorn[standard]" pydantic pydantic-settings pytest httpx \
            sqlalchemy alembic psycopg2-binary python-dotenv \
            "python-jose[cryptography]" "passlib[bcrypt]" "bcrypt==3.2.2" \
            groq pypdf weaviate-client langchain langgraph "mcp<2" langchain-mcp-adapters
      - name: Run tests
        run: pytest -q