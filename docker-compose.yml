services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: placepilot
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  weaviate:
    image: cr.weaviate.io/semitechnologies/weaviate:1.28.4
    ports:
      - "8080:8080"
      - "50051:50051"
    environment:
      QUERY_DEFAULTS_LIMIT: 25
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "true"
      PERSISTENCE_DATA_PATH: "/var/lib/weaviate"
      DEFAULT_VECTORIZER_MODULE: "none"
      ENABLE_MODULES: ""
      CLUSTER_HOST: "node1"
    volumes:
      - weaviate_data:/var/lib/weaviate
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8080/v1/.well-known/ready"]
      interval: 5s
      timeout: 3s
      retries: 12

  api:
    build: ./backend
    environment: &backend_env
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@postgres:5432/placepilot
      REDIS_URL: redis://redis:6379/0
      WEAVIATE_URL: http://weaviate:8080
      WEAVIATE_GRPC_PORT: "50051"
      GROQ_API_KEY: ${GROQ_API_KEY}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      MCP_HOST: mcp-placement
      MCP_PLACEMENT_URL: http://mcp-placement:8101/mcp
      MCP_STUDENT_URL: http://mcp-student:8102/mcp
      MCP_KNOWLEDGE_URL: http://mcp-knowledge:8103/mcp
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      weaviate:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             python -m app.db.seed || true &&
             python -m app.ai.ingest --prune || true &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

  mcp-placement:
    build: ./backend
    environment:
      <<: *backend_env
      # Each MCP server gets the shared DB/infra but its own port.
    depends_on:
      postgres:
        condition: service_healthy
      weaviate:
        condition: service_healthy
    command: python -m app.mcp.run placement

  mcp-student:
    build: ./backend
    environment:
      <<: *backend_env
    depends_on:
      postgres:
        condition: service_healthy
    command: python -m app.mcp.run student

  mcp-knowledge:
    build: ./backend
    environment:
      <<: *backend_env
    depends_on:
      postgres:
        condition: service_healthy
      weaviate:
        condition: service_healthy
    command: python -m app.mcp.run knowledge

volumes:
  pgdata:
  weaviate_data:
